name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fast gates first: typecheck ~2s, tests ~1s, build ~30s+.
      # tsc is not redundant with `next build` (which also type-checks) — it
      # fails in seconds, covers scripts/*.mjs via allowJs, and survives anyone
      # setting typescript.ignoreBuildErrors. It also type-checks the *.dev.*
      # curation files, so the local-only tooling cannot silently rot.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds from data/products.json, which is committed. data/raw-products.json
      # is now committed too (2026-08-05), so the pipeline CAN run in Actions —
      # but only from .github/workflows/refresh.yml, never here. CI must stay
      # read-only with respect to the catalogue.
      - name: Build
        run: npm run build

      # The build gate (next.config.ts pageExtensions) is the only layer that
      # actually removes the code, and it relies on a Next internal that is not
      # documented for this purpose. This step is its regression test: it reads
      # the real build output, so it catches a Next upgrade changing the
      # matcher, a merge conflict reinstating app/api/curate/route.ts, or
      # anyone widening pageExtensions.
      - name: Assert local-only routes are not deployed
        run: npm run verify:gate

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
