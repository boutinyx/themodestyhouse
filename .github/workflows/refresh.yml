name: Catalogue refresh

# Re-fetches all 32 brand feeds, detects what they added / removed / changed,
# republishes data/products.json and pushes. Railway redeploys on the push.
#
# Design: docs/superpowers/specs/2026-08-05-catalogue-refresh-design.md
# Rules:  lib/lifecycle.ts (unit-tested; nothing here decides what gets hidden)

on:
  schedule:
    # 04:10 UTC daily. Off the hour because GitHub's scheduler is busiest then
    # and delays runs at :00. Early UTC is the quiet period for both the US and
    # UK storefronts we scrape.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      brands:
        description: "Space-separated brand slugs (blank = all 32)"
        required: false
        default: ""
      allow_large_diff:
        description: "Bypass the per-brand collapse guard (only after reading the report)"
        type: boolean
        default: false

# NEVER run two refreshes at once — they clash on data/raw-products.json (§10.7).
# cancel-in-progress is false on purpose: a run that is already partway through
# has checkpointed real work, and killing it to start over wastes it.
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  refresh:
    name: fetch feeds, publish, push
    runs-on: ubuntu-latest
    # A full run is ~6 min, but 429 backoff can add several more per brand.
    timeout-minutes: 45
    outputs:
      # Whether this run actually committed anything. A refresh that finds no
      # catalogue changes must not announce a change to four search engines.
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fail before touching the network if the repo is broken. A refresh that
      # publishes from a broken tree would push bad data to production.
      - name: Test
        run: npm test

      - name: Refresh catalogue
        env:
          ALLOW_LARGE_DIFF: ${{ inputs.allow_large_diff && '1' || '' }}
        run: npm run refresh ${{ inputs.brands }}

      # Everything below is skipped if the refresh failed — including the push.
      # A tripped collapse guard therefore leaves production untouched and the
      # run red, which is the intended behaviour.

      # THE TRANSLATION GAP, closed 2026-09-04.
      #
      # build-data.mjs can only LOOK UP a title in data/title-translations.json;
      # scripts/translate_titles.py is what POPULATES it, and it needs the
      # network. Until now the only thing that ran it was the `postrefresh` npm
      # hook, guarded on `[ -x .venv-style/bin/python ]` — a venv that exists on
      # Tina's laptop and on no runner. So every night this job added arrivals
      # whose titles had never been seen and published them in Dutch, French,
      # German and Turkish, printing the count and waiting for a human. On
      # 2026-09-04 that human noticed, and it was 186 products.
      #
      # deep_translator is the script's ONLY third-party import, so a plain
      # `pip install` is the whole dependency. Everything else is stdlib.
      #
      # continue-on-error because the endpoint is free and unofficial: a bad
      # night must not red a run whose catalogue is already correct. Failure is
      # not silent — the script caches only clean results, so anything it could
      # not translate stays uncached, and `untranslatedTitles` in the step
      # summary says so in a warning block. A number that stays non-zero across
      # nights means this step is broken, not lagging.
      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Translate new titles
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          pip install --quiet "deep-translator==1.11.4"
          # No --no-republish: the script re-runs the publish itself (invoking
          # node_modules/.bin/tsx directly, NOT `npm run build:data`, whose
          # postbuild hook calls this script and would recurse), so the new
          # titles are applied to products.json in this same step.
          python3 scripts/translate_titles.py

      - name: Summarise
        if: success()
        run: npm run refresh:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        id: push
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "modesty-house-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # title-translations.json is in this list because the translate step
          # above writes it. Without it the cache would be rebuilt from nothing
          # every night — the same titles re-sent to a free endpoint for ever,
          # and no record of the ones it already got right.
          git add data/raw-products.json data/products.json data/decisions.json \
                  data/rejected.json data/review.json data/refresh-report.json \
                  data/title-translations.json
          if git diff --cached --quiet; then
            echo "No catalogue changes — nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUMMARY=$(node -e "
            const r=require('./data/refresh-report.json').totals;
            console.log(\`+\${r.added} new, \${r.delisted} delisted, \${r.updated} updated, \${r.filtered} filtered\`);
          ")
          git commit -m "data: nightly catalogue refresh — ${SUMMARY}" \
                     -m "Automated run of scripts/refresh.mjs. See data/refresh-report.json."
          # Rebase rather than force: a human push during the run must win.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Uploaded even on failure — when the collapse guard trips, this report is
      # the evidence needed to decide whether the collapse was real.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: data/refresh-report.json
          if-no-files-found: warn
          retention-days: 90

  # A push made with GITHUB_TOKEN does NOT trigger `on: push` workflows —
  # GitHub's recursion guard. So indexnow.yml can never see the commit above,
  # even though it is the one push per day that changes every lane page. Call it
  # explicitly instead. Only when something was actually committed, and never
  # in a way that can fail the refresh: the catalogue is already published and
  # deployed by this point, and a search-engine ping is not worth a red run.
  indexnow:
    name: notify IndexNow
    needs: refresh
    if: needs.refresh.outputs.pushed == 'true'
    uses: ./.github/workflows/indexnow.yml
    permissions:
      contents: read
